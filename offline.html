<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline - Seat Availability</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 2rem;
      background: #f3f4f6;
      color: #111827;
    }

    .card {
      margin: auto;
      max-width: 500px;
      padding: 1.5rem;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, .08);
    }

    h1 {
      margin-top: 0;
      color: #1d4ed8;
    }

    p {
      line-height: 1.4;
    }

    a {
      color: #1d4ed8;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Offline Mode</h1>
    <p>You're offline right now. This app can still work for checking saved station data and UI features while offline.
    </p>
    <p>When you reconnect, refresh to fetch live seat data.</p>
    <a href="/index.html">Go back</a>
  </div>
</body>

</html>
