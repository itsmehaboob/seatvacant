<!-- index.html -->
<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1d4ed8">
    <title>Seat Availability</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>
    <header>Seat Availability Finder</header>

    <div class="container">

        <div class="card">
            <div class="input-row">
                <input id="trainNo" placeholder="Train Number">
                <button id="loadRouteBtn" class="inline-button" onclick="loadRouteInfo()">Load Train Info</button>
            </div>
            <input id="date" type="date">
            <input id="cls" placeholder="Class (SL, 3A)">
            <input id="chartType" placeholder="Charting Type">
            <input id="remoteStation" placeholder="Remote Station">
            <select id="from"></select>
            <select id="to"></select>

            <div id="loader" class="loader hidden"></div>
            <button onclick="fetchData()">Check Availability</button>
        </div>

        <div class="card">
            <input id="search" class="search-box" placeholder="Search..." onkeyup="filterTable()">

            <div class="table-container">
                <div id="results"></div>
            </div>

        </div>

    </div>

    <script src="common.js"></script>
    <script src="app.js"></script>
    <script src="ui.js"></script>

</body>

</html>
